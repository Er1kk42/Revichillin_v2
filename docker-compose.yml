version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revichillin_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    # Kontajner "app" sa spustí až keď je MySQL pripravená (healthcheck nižšie
    # hlási "healthy"). Bez toho by entrypoint skúšal spustiť migrácie skôr,
    # než databáza beží, a skončil by chybou.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - revichillin

  webserver:
    image: nginx:stable-alpine
    container_name: revichillin_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - revichillin

  db:
    image: mysql:8.0
    container_name: revichillin_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: revichillin
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: revichillin
      MYSQL_PASSWORD: revichillin
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    # Healthcheck = Docker každých 5 s skúsi, či MySQL odpovedá (mysqladmin ping).
    # -h 127.0.0.1 = pripájame sa cez sieť (TCP): pri prvom štarte MySQL najprv
    # beží dočasne bez siete, kým vytvára databázu a používateľa, takže ping
    # uspeje až keď je naozaj pripravená. retries 20 = čaká max. ~100 s.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - revichillin

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: revichillin_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - revichillin

  node:
    image: node:20-alpine
    container_name: revichillin_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - revichillin

networks:
  revichillin:
    driver: bridge

volumes:
  dbdata:
    driver: local
